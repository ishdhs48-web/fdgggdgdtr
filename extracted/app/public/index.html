<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>models · deepseek bridge</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <div class="brand-name">models</div>
        <div class="brand-sub" id="accountLine">deepseek bridge</div>
      </div>
    </div>

    <div class="section-head">
      <span>модели</span>
      <span class="badge" id="modelCount">0</span>
    </div>
    <div class="model-list" id="modelList"></div>

    <div class="section-head">
      <span>чаты</span>
      <button class="ghost" id="newChatBtn" title="новый чат">+</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="chat">
    <header class="topbar">
      <div class="topbar-left">
        <div class="model-pill" id="activeModel">—</div>
        <div class="model-meta" id="activeMeta"></div>
      </div>
      <div class="topbar-right">
        <label class="toggle" title="Deep thinking — держим выключенным">
          <input type="checkbox" id="thinkingToggle" />
          <span>thinking</span>
        </label>
        <label class="toggle" title="Smart Search">
          <input type="checkbox" id="searchToggle" checked />
          <span>search</span>
        </label>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="empty" id="emptyState">
        <div class="empty-title">выбери модель слева</div>
        <div class="empty-sub">её инструкции уедут в системный промпт, дальше — обычный чат</div>
      </div>
    </div>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="напиши сообщение…  (Enter — отправить)"></textarea>
      <button type="submit" id="sendBtn" class="send" aria-label="отправить">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </main>
</div>

<div class="modal" id="tokenModal" hidden>
  <div class="modal-card">
    <div class="modal-title">нужен токен</div>
    <div class="modal-sub">залогинься на chat.deepseek.com, открой DevTools → Console и вставь:</div>
    <pre class="snippet" id="snippet">JSON.parse(localStorage.getItem('userToken')).value</pre>
    <div class="modal-sub">полученную строку — сюда:</div>
    <textarea id="tokenInput" class="token-input" placeholder="CRh7mA2…" spellcheck="false"></textarea>
    <div class="modal-error" id="tokenError"></div>
    <button class="primary" id="tokenSave">сохранить</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
